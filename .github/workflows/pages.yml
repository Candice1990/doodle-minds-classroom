name: Publish classroom lessons
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Import the initial organized backup
        if: hashFiles('courses.json') == ''
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path.cwd().resolve()
          with ZipFile('archives/classroom-source.zip') as archive:
              for entry in archive.infolist():
                  relative = Path(entry.filename)
                  if relative.is_absolute() or '..' in relative.parts or relative.parts[0] in {'.git', '.github', 'docs'}:
                      raise ValueError('Invalid archive entry')
                  archive.extract(entry, root)
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import organized lesson source, audio, worksheet PDFs and skills'
          git push origin HEAD:main
      - name: Build selected lessons
        run: python3 tools/build-pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
